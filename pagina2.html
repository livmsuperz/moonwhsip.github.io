<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarot - Moon Whisp</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/https://livmsuperz.github.io/moonwhsip.github.io/favicon.ico,enter/ my-favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/https://livmsuperz.github.io/moonwhsip.github.io/favicon.ico,enter/ my-favicon/favicon.svg" />
    <link rel="shortcut icon" href="/https://livmsuperz.github.io/moonwhsip.github.io/favicon.ico,enter/ my-favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/https://livmsuperz.github.io/moonwhsip.github.io/favicon.ico,enter/ my-favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/https://livmsuperz.github.io/moonwhsip.github.io/favicon.ico,enter/ my-favicon/site.webmanifest" />
</head>

<body class="tarot-body">

    <img src="curtain.png" alt="" class="curtain">

    <header class="top-bar">

        <div class="logo">
            ✧:Moon Whisp:✧
        </div>

        <!-- ZOEKEN -->
        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Search for a tarot card..."
                autocomplete="off"
            >

        </div>

    </header>



    <!-- =====================================
         PAGINA
    ====================================== -->

    <main class="tarot-page">

        <h1 class="tarot-title">
            Tarot Cards
        </h1>

        <p class="tarot-subtitle">
            ✧ find the meaning of your card ✧
        </p>


        <!-- HIER KOMEN DE KAARTEN -->
        <div id="cardContainer" class="card-container"></div>


        <!-- GEEN RESULTATEN -->
        <div id="noResults" class="no-results">
            No tarot card found.
        </div>


        <!-- TERUG NAAR HOMEPAGE -->
        <div class="back-home">

            <a href="index.html">
                ✧ back to home ✧
            </a>

        </div>

    </main>



    <!-- =====================================
         TAROT JAVASCRIPT
    ====================================== -->
    
    <script src="script.js"></script>

</body>

</html>
